name: GitGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile src/main.py src/history.py dashboard.py
      - name: Run offline scanner regression tests
        run: python src/main.py --self-test
      - name: Run database and security tests
        run: python -m unittest discover -s tests -v
